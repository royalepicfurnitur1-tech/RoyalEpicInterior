<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Epic Interior & Furniture</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirection fix
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 50px; background: #0a0a0a; color: #fff; min-height: 100vh;">
      <h2 style="color: #d4af37;">Royal Epic Interior & Furniture</h2>
      <p>Redirecting to requested page...</p>
    </div>
  </body>
</html>
